 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Connect - Landing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-50">

  <!-- Hero Section -->
  <section class="relative h-screen flex items-center justify-center text-center">
    <img src="hungry.jpg" 
         alt="Hungry People" 
         class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-black bg-opacity-60"></div>

    <div class="relative z-10 text-white px-6">
      <h1 class="text-5xl md:text-6xl font-extrabold leading-tight animate-fadeIn">
        Food Connect
      </h1>
      <p class="mt-4 text-lg md:text-xl text-gray-200 max-w-2xl mx-auto">
        Together, we’ve fed <span class="font-bold text-orange-400">500+</span> poor people 
        and supported multiple NGOs.
      </p>
      <button onclick="openSignup()" 
              class="mt-6 px-8 py-3 bg-emerald-600 hover:bg-emerald-700 
                     rounded-lg shadow-lg font-semibold text-lg transition">
        Sign Up
      </button>
    </div>
  </section>

  <!-- Signup Modal -->
  <div id="signupModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-11/12 md:w-1/2 lg:w-1/3 p-8 relative animate-fadeIn">
      <button onclick="closeSignup()" class="absolute top-3 right-3 text-gray-600 hover:text-black">✕</button>
      <h2 class="text-2xl font-bold text-emerald-700 mb-4 text-center">Sign Up</h2>
      <form id="signupForm" class="space-y-4">
        <input type="text" placeholder="Full Name" required 
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input type="email" placeholder="Email Address" required 
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <select required 
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">Select Role</option>
          <option value="donor">Donor (Restaurant/Cafe)</option>
          <option value="ngo">NGO</option>
        </select>
        <input type="password" placeholder="Password" required 
               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button type="submit" 
                class="w-full py-2 bg-emerald-600 text-white rounded-lg shadow hover:bg-emerald-700">
          Create Account
        </button>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById('signupModal');
    const form = document.getElementById('signupForm');

    function openSignup() {
      modal.classList.remove('hidden');
    }
    function closeSignup() {
      modal.classList.add('hidden');
    }
    form.addEventListener('submit', (e) => {
      e.preventDefault();
          alert('🎉 Sign-up successful! Redirecting to your achievements page...');

      window.location.href = 'achievements.html';
    });
  </script>

  <style>
    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }
    .animate-fadeIn {
      animation: fadeIn 1s ease-out forwards;
    }
  </style>
</body>
</html>
